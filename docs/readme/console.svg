<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="0.55" stop-color="#0d0a16"/>
      <stop offset="1" stop-color="#120c1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.78" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1d6e"/>
      <stop offset="0.6" stop-color="#1e1540"/>
      <stop offset="1" stop-color="#0f0b1d"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a16" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d0a16" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="c6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9a8d4"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3050"/>
      <stop offset="1" stop-color="#1c1629"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="focus" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#a78bfa" flood-opacity="0.85"/>
    </filter>
    <clipPath id="screen"><rect x="770" y="70" width="760" height="428" rx="14"/></clipPath>
  </defs>

  <rect width="1600" height="680" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="680" rx="28" fill="url(#glow)"/>
  <rect width="1600" height="680" rx="28" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="1598.5" height="678.5" rx="27.5" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Words -->
  <text x="80" y="150" font-size="17" font-weight="700" letter-spacing="4" fill="#a78bfa">CONSOLE MODE</text>
  <text x="78" y="222" font-size="58" font-weight="700" fill="#f5f3ff">From boot to game</text>
  <text x="78" y="290" font-size="58" font-weight="700" fill="url(#accent)">with only a gamepad.</text>
  <text x="80" y="352" font-size="23" fill="#b8b0d0">Your games, the stores, downloads, Wi-Fi, Bluetooth,</text>
  <text x="80" y="386" font-size="23" fill="#b8b0d0">sound and power: full screen, made for the couch.</text>

  <g font-size="17" fill="#e9e4ff">
    <rect x="80" y="430" width="252" height="44" rx="22" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/>
    <text x="206" y="458" text-anchor="middle">Quick menu over a game</text>
    <rect x="344" y="430" width="210" height="44" rx="22" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/>
    <text x="449" y="458" text-anchor="middle">On-screen keyboard</text>
    <rect x="80" y="486" width="300" height="44" rx="22" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/>
    <text x="230" y="514" text-anchor="middle">Xbox, PlayStation, Nintendo</text>
    <rect x="392" y="486" width="162" height="44" rx="22" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.14"/>
    <text x="473" y="514" text-anchor="middle">Store logins</text>
  </g>
  <text x="80" y="590" font-size="18" fill="#8f86aa">Press the pad's middle button or F11.</text>

  <!-- Screen -->
  <g filter="url(#shadow)">
    <rect x="756" y="56" width="788" height="456" rx="22" fill="#05040a" stroke="#fff" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>
  <rect x="890" y="512" width="520" height="10" rx="5" fill="#1d1730"/>
  <g clip-path="url(#screen)">
    <rect x="770" y="70" width="760" height="428" fill="url(#hero)"/>
    <circle cx="1350" cy="150" r="220" fill="#7c3aed" fill-opacity="0.25"/>
    <circle cx="1450" cy="120" r="120" fill="#c4b5fd" fill-opacity="0.12"/>
    <rect x="770" y="250" width="760" height="248" fill="url(#fade)"/>
    <!-- Top bar -->
    <rect x="800" y="94" width="30" height="30" rx="8" fill="url(#c1)"/>
    <path d="M815 101 l8 16 h-4 l-4-8 l-4 8 h-4 z" fill="#fff"/>
    <text x="842" y="115" font-size="15" font-weight="600" fill="#f5f3ff">Home</text>
    <text x="902" y="115" font-size="15" fill="#a59cbf">Library</text>
    <text x="970" y="115" font-size="15" fill="#a59cbf">Stores</text>
    <text x="1034" y="115" font-size="15" fill="#a59cbf">Downloads</text>
    <text x="1500" y="115" font-size="15" font-weight="600" text-anchor="end" fill="#f5f3ff">21:30</text>
    <!-- Spotlight -->
    <text x="800" y="196" font-size="30" font-weight="700" fill="#fff">Starfall Odyssey</text>
    <text x="800" y="224" font-size="14" fill="#c9c2e0">Windows game  ·  Proton-CachyOS  ·  42 h</text>
    <rect x="800" y="240" width="96" height="32" rx="16" fill="#fff"/>
    <text x="848" y="261" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1030">Play</text>
    <rect x="906" y="240" width="96" height="32" rx="16" fill="#fff" fill-opacity="0.12"/>
    <text x="954" y="261" font-size="14" text-anchor="middle" fill="#f5f3ff">Settings</text>
    <!-- Shelf -->
    <g filter="url(#focus)">
      <rect x="800" y="300" width="112" height="158" rx="12" fill="url(#c1)"/>
    </g>
    <rect x="800" y="300" width="112" height="158" rx="12" fill="url(#shine)"/>
    <rect x="797" y="297" width="118" height="164" rx="14" fill="none" stroke="#fff" stroke-width="3"/>
    <rect x="928" y="314" width="96" height="136" rx="10" fill="url(#c2)"/>
    <rect x="1038" y="314" width="96" height="136" rx="10" fill="url(#c3)"/>
    <rect x="1148" y="314" width="96" height="136" rx="10" fill="url(#c4)"/>
    <rect x="1258" y="314" width="96" height="136" rx="10" fill="url(#c5)"/>
    <rect x="1368" y="314" width="96" height="136" rx="10" fill="url(#c6)"/>
    <rect x="1478" y="314" width="96" height="136" rx="10" fill="url(#c2)"/>
    <g fill="#fff" fill-opacity="0.85">
      <rect x="814" y="430" width="62" height="7" rx="3.5"/>
      <rect x="940" y="428" width="50" height="6" rx="3"/>
      <rect x="1050" y="428" width="50" height="6" rx="3"/>
      <rect x="1160" y="428" width="50" height="6" rx="3"/>
      <rect x="1270" y="428" width="50" height="6" rx="3"/>
      <rect x="1380" y="428" width="50" height="6" rx="3"/>
    </g>
    <!-- Hints -->
    <g font-size="13" fill="#d4cde8">
      <circle cx="1338" cy="480" r="10" fill="#fff" fill-opacity="0.92"/>
      <text x="1338" y="484.5" text-anchor="middle" font-weight="700" font-size="12" fill="#1a1030">A</text>
      <text x="1354" y="485">Play</text>
      <circle cx="1410" cy="480" r="10" fill="#fff" fill-opacity="0.92"/>
      <text x="1410" y="484.5" text-anchor="middle" font-weight="700" font-size="12" fill="#1a1030">X</text>
      <text x="1426" y="485">Menu</text>
      <circle cx="1484" cy="480" r="10" fill="#fff" fill-opacity="0.92"/>
      <text x="1484" y="484.5" text-anchor="middle" font-weight="700" font-size="12" fill="#1a1030">B</text>
      <text x="1500" y="485">Back</text>
    </g>
  </g>

  <!-- Gamepad -->
  <g transform="translate(596 466) scale(0.86)" filter="url(#shadow)">
    <path d="M70 18 C100 4 140 8 160 22 L200 22 C220 8 260 4 290 18 C326 34 350 110 356 170 C360 206 336 226 310 214 C290 204 272 178 256 160 C246 150 236 146 222 146 L138 146 C124 146 114 150 104 160 C88 178 70 204 50 214 C24 226 0 206 4 170 C10 110 34 34 70 18 Z" fill="url(#pad)" stroke="#fff" stroke-opacity="0.16" stroke-width="1.5"/>
    <path d="M70 18 C100 4 140 8 160 22 L200 22 C220 8 260 4 290 18 C326 34 350 110 356 170 C360 206 336 226 310 214 C290 204 272 178 256 160 C246 150 236 146 222 146 L138 146 C124 146 114 150 104 160 C88 178 70 204 50 214 C24 226 0 206 4 170 C10 110 34 34 70 18 Z" fill="url(#shine)"/>
    <!-- Left stick -->
    <circle cx="96" cy="70" r="26" fill="#120e1c" stroke="#fff" stroke-opacity="0.12"/>
    <circle cx="96" cy="70" r="17" fill="#2c2440"/>
    <!-- D-pad -->
    <g fill="#120e1c" stroke="#fff" stroke-opacity="0.1">
      <rect x="128" y="104" width="14" height="40" rx="3"/>
      <rect x="115" y="117" width="40" height="14" rx="3"/>
    </g>
    <!-- Right stick -->
    <circle cx="218" cy="124" r="22" fill="#120e1c" stroke="#fff" stroke-opacity="0.12"/>
    <circle cx="218" cy="124" r="14" fill="#2c2440"/>
    <!-- Face buttons -->
    <circle cx="264" cy="50" r="11" fill="#a78bfa"/>
    <circle cx="242" cy="72" r="11" fill="#c4b5fd"/>
    <circle cx="286" cy="72" r="11" fill="#8b5cf6"/>
    <circle cx="264" cy="94" r="11" fill="#ede9fe"/>
    <!-- Middle button -->
    <circle cx="180" cy="52" r="14" fill="url(#c1)" filter="url(#focus)"/>
    <path d="M180 44 l6 12 h-3 l-3-6 l-3 6 h-3 z" fill="#fff"/>
    <rect x="148" y="78" width="14" height="7" rx="3.5" fill="#120e1c"/>
    <rect x="198" y="78" width="14" height="7" rx="3.5" fill="#120e1c"/>
  </g>
</svg>
