[package]
name = "arkor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arkor-core.workspace = true
arkor-stores.workspace = true
arkor-launch.workspace = true
anyhow.workspace = true
serde_json.workspace = true
dirs.workspace = true
gpui.workspace = true
unicode-segmentation.workspace = true
libc.workspace = true
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
gilrs = "0.11.2"
async-channel = "2.5"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }

[dev-dependencies]
tempfile.workspace = true
# gpui's headless test platform (same gpui-pre gpui-kit uses), for simulated key presses.
gpui_test = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }
