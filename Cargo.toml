[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
arkor-core = { path = "crates/arkor-core" }
arkor-stores = { path = "crates/arkor-stores" }
arkor-launch = { path = "crates/arkor-launch" }
# gpui-kit (gpui-pre + gpui-component), the toolkit Modus uses; imported under the name `gpui`.
gpui = { package = "gpui-kit", version = "=0.8.1" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"
libc = "0.2"
anyhow = "1"
dirs = "6"
